<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Броски за 45 секунд</title>
<!-- Нужен внутри Telegram. Вне Telegram игра работает и без него. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --court: #1F4FA3;
    --wall: #12306A;
    --ink: #0E1A33;
    --clock: #FF5A36;
    --ball: #F2771F;
    --card: #FFFFFF;
    --card-ink: #0E1A33;
    --muted: #5B6782;
    --btn2: #E6ECF7;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --card: #0F1B36; --card-ink: #EEF2FA; --muted: #9AA6C2; --btn2: #1C2B4F; }
  }
  :root[data-theme="dark"] { --card: #0F1B36; --card-ink: #EEF2FA; --muted: #9AA6C2; --btn2: #1C2B4F; }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    margin: 0; overflow: hidden; overscroll-behavior: none;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { height: 100%; background: var(--wall); font-family: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    pointer-events: none; color: #EEF2FA;
  }
  .stat { display: flex; flex-direction: column; line-height: 1; }
  .stat small { font-size: 13px; opacity: .75; margin-bottom: 4px; }
  .stat b { font-family: "Russo One", Impact, sans-serif; font-weight: 400; font-size: 32px; font-variant-numeric: tabular-nums; }
  .stat.right { align-items: flex-end; }
  .clock {
    font-family: "Russo One", Impact, sans-serif; font-size: 34px; line-height: 1;
    color: var(--clock); background: var(--ink); padding: 8px 14px 6px;
    border-radius: 8px; border: 2px solid rgba(255,255,255,.14);
    font-variant-numeric: tabular-nums; min-width: 72px; text-align: center;
    text-shadow: 0 0 12px rgba(255,90,54,.55);
  }
  .clock.hot { animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .clock.hot { animation: none; } }

  .overlay {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 24px;
    background: rgba(9,18,40,.55);
  }
  .overlay[hidden] { display: none; }
  .card {
    width: 100%; max-width: 340px; background: var(--card); color: var(--card-ink);
    border-radius: 22px; padding: 26px 22px 20px; text-align: center;
    box-shadow: 0 18px 50px rgba(0,0,0,.35);
  }
  .card h1 { font-family: "Russo One", Impact, sans-serif; font-weight: 400; font-size: 30px; line-height: 1.05; margin: 0 0 12px; }
  .card p { margin: 0 0 12px; line-height: 1.45; font-size: 15px; }
  .card .muted { color: var(--muted); }
  .card .big { font-family: "Russo One", Impact, sans-serif; font-size: 76px; line-height: 1; color: var(--ball); margin: 4px 0 2px; }
  .card .goal { background: var(--btn2); border-radius: 12px; padding: 10px 12px; font-weight: 500; }
  .card button {
    display: block; width: 100%; border: 0; border-radius: 14px; padding: 15px;
    font: 700 16px "Rubik", system-ui, sans-serif; cursor: pointer; margin-top: 10px;
  }
  .card .primary { background: var(--ball); color: #fff; }
  .card .secondary { background: var(--btn2); color: var(--card-ink); }
  .card button:focus-visible { outline: 3px solid #7FB2FF; outline-offset: 2px; }
  .note { font-size: 13px; color: var(--muted); margin: 10px 0 0; min-height: 1em; }
</style>
</head>
<body>
<canvas id="court"></canvas>

<div class="hud">
  <div class="stat"><small>Забито</small><b id="score">0</b></div>
  <div class="clock" id="clock">45</div>
  <div class="stat right" id="rivalBox" hidden><small>Цель</small><b id="rival">0</b></div>
</div>

<div class="overlay" id="overlay"><div class="card" id="card"></div></div>

<script>
/* ===== Настройки ===== */
const APP_LINK = 'https://t.me/YOUR_BOT/YOUR_APP'; // ссылка из BotFather (/newapp)
const GAME_TIME = 45;

/* ===== Telegram ===== */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
const inTg = !!(tg && tg.initData);
if (tg) {
  try { tg.ready(); tg.expand(); } catch (e) {}
  // Важно: иначе свайп вверх сворачивает Mini App вместо броска
  try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
  try { tg.setHeaderColor('#12306A'); tg.setBackgroundColor('#12306A'); } catch (e) {}
  if (tg.colorScheme) document.documentElement.dataset.theme = tg.colorScheme;
}
function haptic(kind) {
  try {
    if (!tg || !tg.HapticFeedback) return;
    if (kind === 'success') tg.HapticFeedback.notificationOccurred('success');
    else tg.HapticFeedback.impactOccurred(kind);
  } catch (e) {}
}

// Вызов от друга: ссылка вида t.me/bot/app?startapp=c12
const startParam = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param)
  || new URLSearchParams(location.search).get('startapp') || '';
const rivalScore = /^c\d{1,3}$/.test(startParam) ? parseInt(startParam.slice(1), 10) : null;

/* ===== Состояние ===== */
const $ = id => document.getElementById(id);
const cv = $('court'), ctx = cv.getContext('2d');
let W, H, DPR, G, R0, RIM, CW;
const hoop = {}, L = {};
const ball = { x: 0, y: 0, vx: 0, vy: 0, r: 30, rot: 0, spin: 0, state: 'ready', pop: 1 };
let playing = false, endAt = 0, score = 0, shots = 0, netKick = 0;
const texts = [];

function getBest() { try { return parseInt(localStorage.getItem('hoops-best') || '0', 10); } catch (e) { return 0; } }
function setBest(v) { try { localStorage.setItem('hoops-best', String(v)); } catch (e) {} }

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  R0 = Math.max(26, Math.min(W * 0.1, H * 0.06));
  RIM = Math.max(3, R0 * 0.09);
  CW = Math.min(W, H * 0.8);
  hoop.x = W / 2; hoop.y = Math.max(H * 0.33, 200); hoop.hw = R0 * 0.98;
  L.base = hoop.y + R0 * 3.4;
  L.ft = Math.max(H * 0.62, L.base + R0 * 1.5);
  L.startY = Math.min(H * 0.84, H - R0 - 48);
  G = H * 2.4;
  if (ball.state !== 'flying') placeBall(true);
}

function placeBall(keepX) {
  if (!keepX || !ball.x) ball.x = W / 2 - CW * 0.18 + Math.random() * CW * 0.36;
  ball.y = L.startY; ball.vx = ball.vy = 0;
  ball.state = 'ready'; ball.r = R0; ball.maxP = 0; ball.apex = false;
  ball.touched = false; ball.scored = false; ball.t = 0; ball.spin = 0;
  if (!keepX) ball.pop = 0;
}

/* ===== Свайп ===== */
let swipe = null;
cv.addEventListener('pointerdown', e => {
  if (!playing || ball.state !== 'ready' || e.clientY < H * 0.5) return;
  swipe = [{ x: e.clientX, y: e.clientY, t: performance.now() }];
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointermove', e => {
  if (!swipe) return;
  swipe.push({ x: e.clientX, y: e.clientY, t: performance.now() });
  if (swipe.length > 30) swipe.shift();
});
function endSwipe(e) {
  if (!swipe) return;
  const pts = swipe; swipe = null;
  const now = performance.now();
  const last = { x: e.clientX, y: e.clientY, t: now };
  let first = pts[0];
  for (const p of pts) { if (now - p.t <= 140) { first = p; break; } }
  const dt = Math.max(8, last.t - first.t) / 1000;
  const dx = last.x - first.x, dy = last.y - first.y;
  if (dy > -25 || pts[0].y - last.y < 30) return; // слишком короткий или не вверх
  throwBall(dx / dt, dy / dt);
}
cv.addEventListener('pointerup', endSwipe);
cv.addEventListener('pointercancel', () => { swipe = null; });

function throwBall(vxS, vyS) {
  const vRef = Math.sqrt(2 * G * (ball.y - hoop.y));
  const vy = Math.max(-vRef * 1.5, Math.min(-vRef * 0.75, vyS * 0.85));
  let vx = vy * (vxS / vyS) * 0.21;            // направление свайпа = направление броска
  vx = Math.max(-W * 1.2, Math.min(W * 1.2, vx));
  Object.assign(ball, { vx, vy, state: 'flying', y0: ball.y, t: 0, spin: -5 });
  shots++;
  haptic('light');
}

/* ===== Физика ===== */
function step(dt) {
  if (ball.state !== 'flying') return;
  const n = 4, h = dt / n;
  for (let i = 0; i < n; i++) {
    const py = ball.y;
    ball.vy += G * h; ball.x += ball.vx * h; ball.y += ball.vy * h;
    if (ball.vy > 0) ball.apex = true;
    const p = Math.min(1, Math.max(0, (ball.y0 - ball.y) / (ball.y0 - hoop.y)));
    if (p > ball.maxP) ball.maxP = p;
    ball.r = R0 * (1 - 0.38 * ball.maxP);           // мяч «улетает» вглубь
    const deep = ball.apex && ball.maxP >= 1;        // на глубине кольца
    if (!deep) continue;

    for (const s of [-1, 1]) {                       // дужки кольца
      const rx = hoop.x + s * hoop.hw, ry = hoop.y;
      const dx = ball.x - rx, dy = ball.y - ry, d = Math.hypot(dx, dy), min = ball.r + RIM;
      if (d < min && d > 0) {
        const nx = dx / d, ny = dy / d;
        ball.x = rx + nx * min; ball.y = ry + ny * min;
        const vn = ball.vx * nx + ball.vy * ny;
        if (vn < 0) {
          ball.vx -= 1.55 * vn * nx; ball.vy -= 1.55 * vn * ny; ball.vx *= 0.92;
          if (!ball.touched) haptic('rigid');
          ball.touched = true;
        }
      }
    }
    if (!ball.scored && playing && py < hoop.y && ball.y >= hoop.y && Math.abs(ball.x - hoop.x) < hoop.hw - RIM) {
      ball.scored = true; score++; netKick = 1;
      $('score').textContent = score;
      const cheers = ['В яблочко!', 'Прямо в цель!'];
      const cheer = ball.touched ? cheers[Math.floor(Math.random() * cheers.length)] : 'Крууууть';
      texts.push({ t: cheer, x: hoop.x, y: hoop.y - R0 * 1.4, life: 0 });
      haptic('success');
    }
  }
  ball.t += dt;
  if (ball.y - ball.r > H || ball.x < -ball.r * 2 || ball.x > W + ball.r * 2 || ball.t > 3.5) placeBall(false);
}

/* ===== Отрисовка ===== */
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawCourt() {
  ctx.fillStyle = '#12306A'; ctx.fillRect(0, 0, W, L.base);
  ctx.fillStyle = '#1F4FA3'; ctx.fillRect(0, L.base, W, H - L.base);
  ctx.strokeStyle = 'rgba(238,242,250,.85)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(W / 2, L.base, CW * 0.62, (H - L.base) * 0.62, 0, 0, Math.PI); ctx.stroke();
  const bw = CW * 0.17, fw = CW * 0.24;
  ctx.fillStyle = '#173D82';
  ctx.beginPath(); ctx.moveTo(W / 2 - bw, L.base); ctx.lineTo(W / 2 + bw, L.base);
  ctx.lineTo(W / 2 + fw, L.ft); ctx.lineTo(W / 2 - fw, L.ft); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(W / 2, L.ft, fw, fw * 0.32, 0, 0, Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, L.base); ctx.lineTo(W, L.base); ctx.stroke();
}
function drawBoard() {
  const bw = hoop.hw * 2.7, bh = R0 * 2.9, bb = hoop.y + R0 * 0.45, bt = bb - bh;
  ctx.fillStyle = '#0E1A33'; ctx.fillRect(hoop.x - R0 * 0.14, bb, R0 * 0.28, L.base - bb);
  roundRect(hoop.x - bw / 2, bt, bw, bh, R0 * 0.18);
  ctx.fillStyle = 'rgba(248,250,255,.96)'; ctx.fill();
  ctx.lineWidth = Math.max(3, R0 * 0.09); ctx.strokeStyle = '#0E1A33'; ctx.stroke();
  const sw = hoop.hw * 1.25, sh = R0 * 1.15;
  ctx.strokeStyle = '#E3412F'; ctx.lineWidth = Math.max(2.5, R0 * 0.07);
  ctx.strokeRect(hoop.x - sw / 2, hoop.y - sh, sw, sh);
}
function drawRim(front) {
  ctx.strokeStyle = '#E3412F'; ctx.lineWidth = RIM * 2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.ellipse(hoop.x, hoop.y, hoop.hw, hoop.hw * 0.3, 0, front ? 0 : Math.PI, front ? Math.PI : Math.PI * 2);
  ctx.stroke();
}
function drawNet() {
  const n = 10, ry = hoop.hw * 0.3, rb = hoop.hw * 0.6;
  const bot = hoop.y + hoop.hw * 1.15 + netKick * R0 * 0.35;
  ctx.strokeStyle = 'rgba(248,250,255,.9)'; ctx.lineWidth = 1.4;
  for (let i = 0; i <= n; i++) {
    const a = i / n * Math.PI;
    const x1 = hoop.x + Math.cos(a) * hoop.hw, y1 = hoop.y + Math.sin(a) * ry;
    ctx.beginPath(); ctx.moveTo(x1, y1);
    ctx.lineTo(hoop.x + Math.cos(a) * rb, bot + Math.sin(a) * ry * 0.6); ctx.stroke();
    if (i < n) {
      const b = (i + 1) / n * Math.PI;
      ctx.beginPath(); ctx.moveTo(x1, y1);
      ctx.lineTo(hoop.x + Math.cos(b) * rb, bot + Math.sin(b) * ry * 0.6); ctx.stroke();
    }
  }
  ctx.beginPath(); ctx.ellipse(hoop.x, bot, rb, ry * 0.6, 0, 0, Math.PI); ctx.stroke();
}
function drawBall() {
  const k = ball.state === 'ready' ? Math.min(1, ball.pop / 0.15) : 1;
  const r = ball.r * k; if (r < 1) return;
  if (ball.state === 'ready') {
    ctx.fillStyle = 'rgba(8,20,50,.35)';
    ctx.beginPath(); ctx.ellipse(ball.x, ball.y + r * 0.95, r * 0.85, r * 0.22, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.save(); ctx.translate(ball.x, ball.y); ctx.rotate(ball.rot);
  const g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
  g.addColorStop(0, '#FFA552'); g.addColorStop(0.6, '#F2771F'); g.addColorStop(1, '#B9500F');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.clip();
  ctx.strokeStyle = '#2A1A10'; ctx.lineWidth = Math.max(1.2, r * 0.06);
  ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.moveTo(0, -r); ctx.lineTo(0, r); ctx.stroke();
  ctx.beginPath(); ctx.arc(-r * 1.35, 0, r * 0.95, -0.9, 0.9); ctx.stroke();
  ctx.beginPath(); ctx.arc(r * 1.35, 0, r * 0.95, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
  ctx.restore();
}
function drawTexts(dt) {
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i]; t.life += dt;
    if (t.life > 0.9) { texts.splice(i, 1); continue; }
    ctx.globalAlpha = 1 - t.life / 0.9;
    ctx.font = `${Math.round(R0 * 0.75)}px "Russo One", Impact, sans-serif`;
    ctx.textAlign = 'center'; ctx.lineWidth = 5; ctx.strokeStyle = '#0E1A33'; ctx.fillStyle = '#fff';
    const y = t.y - t.life * 50;
    ctx.strokeText(t.t, t.x, y); ctx.fillText(t.t, t.x, y);
    ctx.globalAlpha = 1;
  }
}
function draw(dt) {
  drawCourt(); drawBoard(); drawRim(false);
  const deep = ball.state === 'flying' && ball.apex && ball.maxP >= 1;
  if (deep) { drawBall(); drawNet(); drawRim(true); }
  else { drawNet(); drawRim(true); drawBall(); }
  if (playing && shots === 0 && ball.state === 'ready') {
    ctx.font = '500 15px "Rubik", system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(238,242,250,.9)';
    ctx.fillText('Свайпни мяч к кольцу', ball.x, Math.min(H - 16, ball.y + R0 * 1.7));
  }
  drawTexts(dt);
}

/* ===== Игровой цикл ===== */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (playing) {
    const left = Math.max(0, (endAt - now) / 1000);
    const c = $('clock'); c.textContent = Math.ceil(left);
    c.classList.toggle('hot', left <= 10 && left > 0);
    if (left <= 0) endGame();
  }
  if (ball.state === 'ready') ball.pop += dt;
  ball.rot += (ball.spin + ball.vx / Math.max(ball.r, 1) * 0.3) * dt;
  step(dt);
  netKick *= Math.pow(0.02, dt);
  draw(dt);
  requestAnimationFrame(frame);
}

/* ===== Экраны ===== */
function plural(n, f) {
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return f[0];
  if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return f[1];
  return f[2];
}
function showStart() {
  $('card').innerHTML = `
    <h1>Броски<br>за 45 секунд</h1>
    <p class="muted">Свайпни мяч в сторону кольца. Чем быстрее свайп, тем выше летит мяч.</p>
    ${rivalScore !== null ? `<p class="goal">Друг забил ${rivalScore}. Сможешь больше?</p>` : ''}
    <button class="primary" id="go">Начать</button>`;
  $('overlay').hidden = false;
  $('go').onclick = startGame;
}
function startGame() {
  score = 0; shots = 0; texts.length = 0;
  $('score').textContent = '0';
  $('overlay').hidden = true;
  placeBall(false);
  endAt = performance.now() + GAME_TIME * 1000;
  playing = true;
}
function endGame() {
  playing = false; swipe = null;
  $('clock').classList.remove('hot'); $('clock').textContent = '0';
  const best = Math.max(getBest(), score); setBest(best);
  haptic('heavy');
  let vs = '';
  if (rivalScore !== null) {
    const d = score - rivalScore;
    vs = d > 0 ? `Ты обошёл друга на ${d}` : d === 0 ? `Ничья: ${score} : ${rivalScore}` : `Друг впереди на ${-d}`;
    vs = `<p class="goal">${vs}</p>`;
  }
  $('card').innerHTML = `
    <p class="muted">Время вышло</p>
    <div class="big">${score}</div>
    <p>${plural(score, ['мяч', 'мяча', 'мячей'])} в кольце. Рекорд: ${best}</p>
    ${vs}
    <button class="primary" id="share">Вызвать друга</button>
    <button class="secondary" id="again">Ещё раз</button>
    <p class="note" id="note"></p>`;
  $('overlay').hidden = false;
  $('again').onclick = startGame;
  $('share').onclick = () => challenge(score);
}
function challenge(s) {
  const link = `${APP_LINK}?startapp=c${s}`;
  const text = `Я забил ${s} за 45 секунд 🏀 Побьёшь?`;
  if (inTg) {
    tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(text)}`);
  } else if (navigator.share) {
    navigator.share({ text, url: link }).catch(() => {});
  } else {
    $('note').textContent = 'Отправить вызов можно, когда игра открыта в Telegram.';
  }
}

/* ===== Старт ===== */
window.addEventListener('resize', resize);
resize();
if (rivalScore !== null) { $('rivalBox').hidden = false; $('rival').textContent = rivalScore; }
showStart();
requestAnimationFrame(frame);
</script>
</body>
</html>
