<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Броски за 45 секунд</title>
<!-- Нужен внутри Telegram. Вне Telegram игра работает и без него. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #F5F7FB; --card: #FFFFFF; --ink: #1D2433; --muted: #5F6B7E;
    --line: #D3DAE5; --soft: #E7ECF3;
    --accent: #0D8270; --accent-text: #0D8270; --mint: #3CCFB4;
    --purple: #6A58E8; --coral: #D2432F; --coral-text: #B33A28; --ball: #F28A2E;
    --court: #E4F6F2; --paint: #D6F1EA; --court-line: #C3E9E0; --net: #1D2433;
    --tint-mint: #E4F6F2; --tint-purple: #EEEBFD; --tint-coral: #FCE9E6;
    --shadow: 0 8px 22px rgba(29,36,51,.07);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #10151F; --card: #1A2130; --ink: #EEF2FA; --muted: #A3AEC2; --line: #2C3547; --soft: #2A3344;
      --accent-text: #3CCFB4; --coral-text: #FF8F80; --court: #12302C; --paint: #163A35; --court-line: #2A5C54; --net: #DDE4EE;
      --tint-mint: #173A35; --tint-purple: #2A2550; --tint-coral: #3D1F1B; --shadow: 0 8px 22px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --ground: #10151F; --card: #1A2130; --ink: #EEF2FA; --muted: #A3AEC2; --line: #2C3547; --soft: #2A3344;
    --accent-text: #3CCFB4; --coral-text: #FF8F80; --court: #12302C; --paint: #163A35; --court-line: #2A5C54; --net: #DDE4EE;
    --tint-mint: #173A35; --tint-purple: #2A2550; --tint-coral: #3D1F1B; --shadow: 0 8px 22px rgba(0,0,0,.3);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { margin: 0; overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  body { height: 100%; background: var(--ground); color: var(--ink); font-family: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* ---- HUD ---- */
  .hud { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: min(100%, 520px); padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px 0; pointer-events: none; }
  .hud-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile { background: var(--card); border-radius: 20px; padding: 12px 16px; display: flex; flex-direction: column; box-shadow: var(--shadow); }
  .tile small { font-size: 13px; font-weight: 700; color: var(--muted); }
  .tile b { font-size: 34px; font-weight: 900; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tile.score { background: var(--accent); color: #fff; box-shadow: 0 10px 24px rgba(13,130,112,.25); }
  .tile.score small { color: #fff; }
  .bar { height: 6px; border-radius: 3px; background: var(--soft); margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; background: var(--mint); border-radius: 3px; }
  .tile.hot b { color: var(--coral-text); }
  .goal { margin-top: 10px; display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 14px; padding: 10px 14px; font-size: 15px; font-weight: 700; box-shadow: var(--shadow); }
  .goal[hidden] { display: none; }
  .goal .dot { width: 10px; height: 10px; border-radius: 5px; background: var(--coral); flex: none; }
  .goal .left { margin-left: auto; color: var(--coral-text); }

  /* ---- Экраны ---- */
  .screen { position: fixed; inset: 0; z-index: 10; background: var(--ground); overflow-y: auto; touch-action: pan-y; display: flex; justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 28px) 22px calc(env(safe-area-inset-bottom, 0px) + 24px); }
  .screen[hidden] { display: none; }
  .wrap { width: 100%; max-width: 400px; min-height: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .grow { flex-grow: 1; min-height: 24px; }
  .art { width: 100%; max-width: 300px; height: auto; }
  h1 { margin: 18px 0 0; font-size: 28px; font-weight: 900; line-height: 1.2; }
  .sub { margin: 10px 0 0; font-size: 16px; line-height: 1.5; color: var(--muted); max-width: 310px; }
  .kicker { margin: 8px 0 0; font-size: 16px; font-weight: 700; color: var(--muted); }
  .big { font-size: 88px; font-weight: 900; line-height: 1; margin-top: 2px; }
  .unit { margin: 6px 0 0; font-size: 17px; font-weight: 700; }
  .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%; margin-top: 22px; }
  .stat { border-radius: 20px; padding: 14px 16px; color: #fff; text-align: left; display: flex; flex-direction: column; }
  .stat small { font-size: 15px; font-weight: 700; }
  .stat b { font-size: 32px; font-weight: 900; line-height: 1.15; }
  .stat.purple { background: var(--purple); } .stat.coral { background: var(--coral); }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 12px; background: var(--card); border-radius: 16px; padding: 12px 14px; font-size: 16px; font-weight: 800; text-align: left; box-shadow: var(--shadow); }
  .ico { width: 36px; height: 36px; border-radius: 12px; flex: none; display: flex; align-items: center; justify-content: center; }
  .ico.mint { background: var(--tint-mint); color: var(--accent-text); }
  .ico.purple { background: var(--tint-purple); color: var(--purple); }
  .ico.coral { background: var(--tint-coral); color: var(--coral-text); }
  .rules { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .rules .row { margin-top: 0; font-size: 15px; font-weight: 700; box-shadow: none; }
  .target { width: 100%; margin-top: 22px; background: var(--card); border-radius: 24px; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow); text-align: left; }
  .target small { display: block; font-size: 15px; font-weight: 700; color: var(--muted); }
  .target b { font-size: 44px; font-weight: 900; line-height: 1.05; color: var(--coral-text); }
  .avatars { display: flex; align-items: flex-start; justify-content: center; gap: 14px; margin-top: 8px; }
  .player { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .av { width: 88px; height: 88px; border-radius: 44px; border: 4px solid var(--card); display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 900; }
  .av.me { background: var(--mint); color: #1D2433; box-shadow: 0 10px 24px rgba(60,207,180,.35); }
  .av.friend { background: var(--purple); color: #fff; box-shadow: 0 10px 24px rgba(106,88,232,.3); }
  .vs { width: 44px; height: 44px; border-radius: 22px; background: var(--ink); color: var(--ground); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; margin-top: 22px; }
  .player .name { font-size: 15px; font-weight: 700; color: var(--muted); }
  .player .pts { font-size: 44px; font-weight: 900; line-height: 1; }
  .player .pts.win { color: var(--accent-text); }
  .btn { width: 100%; height: 56px; border: 0; border-radius: 16px; font: 800 17px "Nunito", system-ui, sans-serif; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; margin-top: 12px; }
  .grow + .btn { margin-top: 0; }
  .btn.primary { background: var(--accent); color: #fff; box-shadow: 0 10px 24px rgba(13,130,112,.25); }
  .btn.secondary { background: var(--card); color: var(--ink); border: 2px solid var(--line); }
  .btn:focus-visible, .link:focus-visible { outline: 3px solid #7FB2FF; outline-offset: 2px; }
  .link { background: none; border: 0; height: 44px; margin-top: 6px; font: 700 15px "Nunito", system-ui, sans-serif; color: var(--accent-text); cursor: pointer; }
  .note { margin: 10px 0 0; font-size: 13px; color: var(--muted); min-height: 1em; }
</style>
</head>
<body>
<canvas id="court" aria-label="Баскетбольная площадка"></canvas>

<div class="hud" id="hud">
  <div class="hud-row">
    <div class="tile score"><small>Забито</small><b id="score">0</b></div>
    <div class="tile" id="clockTile"><small>Осталось</small><b id="clock">0:45</b><div class="bar"><i id="bar"></i></div></div>
  </div>
  <div class="goal" id="goal" hidden><span class="dot"></span><span id="goalText"></span><span class="left" id="goalLeft"></span></div>
</div>

<div class="screen" id="overlay"><div class="wrap" id="card"></div></div>

<script>
/* ===== Настройки ===== */
const APP_LINK = 'https://t.me/katia_hoops_bot/hoops'; // ссылка из BotFather (/newapp)
const GAME_TIME = 45;

/* ===== Telegram ===== */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
const inTg = !!(tg && tg.initData);
if (tg) {
  try { tg.ready(); tg.expand(); } catch (e) {}
  // Важно: иначе свайп вверх сворачивает Mini App вместо броска
  try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
  if (inTg && tg.colorScheme) document.documentElement.dataset.theme = tg.colorScheme;
}
function haptic(kind) {
  try {
    if (!tg || !tg.HapticFeedback) return;
    if (kind === 'success') tg.HapticFeedback.notificationOccurred('success');
    else tg.HapticFeedback.impactOccurred(kind);
  } catch (e) {}
}

// c17_<id>     — вызов: счёт и Telegram id того, кто вызвал
// r17_15_<id>  — итог дуэли: счёт вызвавшего, счёт соперника, id вызвавшего
const startParam = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param)
  || new URLSearchParams(location.search).get('startapp') || '';
const myId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? String(tg.initDataUnsafe.user.id) : '';
let rivalScore = null, challengerId = '', finalDuel = null, m;
if ((m = startParam.match(/^c(\d{1,3})(?:_(\d{1,20}))?$/))) {
  rivalScore = parseInt(m[1], 10); challengerId = m[2] || '';
} else if ((m = startParam.match(/^r(\d{1,3})_(\d{1,3})(?:_(\d{1,20}))?$/))) {
  finalDuel = { a: parseInt(m[1], 10), b: parseInt(m[2], 10), aId: m[3] || '' };
}
let bestTry = 0, tries = 0;

/* ===== Состояние ===== */
const $ = id => document.getElementById(id);
const cv = $('court'), ctx = cv.getContext('2d');
let W, H, DPR, G, R0, RIM, CW, C = {};
const hoop = {}, L = {}, P = {};
const ball = { x: 0, y: 0, vx: 0, vy: 0, r: 30, rot: 0, spin: 0, state: 'ready', pop: 1 };
let playing = false, endAt = 0, score = 0, shots = 0, netKick = 0;
const texts = [];

function getBest() { try { return parseInt(localStorage.getItem('hoops-best') || '0', 10); } catch (e) { return 0; } }
function setBest(v) { try { localStorage.setItem('hoops-best', String(v)); } catch (e) {} }

function readColors() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of ['ground', 'card', 'ink', 'muted', 'court', 'paint', 'court-line', 'net', 'mint', 'purple', 'coral', 'ball']) {
    C[k] = cs.getPropertyValue('--' + k).trim();
  }
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  readColors();
  const safeB = parseFloat(getComputedStyle(document.documentElement).paddingBottom) || 0;
  const hudB = $('hud').getBoundingClientRect().bottom;
  P.x = 12; P.y = hudB + 12; P.w = Math.max(120, W - 24); P.h = Math.max(260, H - P.y - 12 - safeB); P.r = 28;
  R0 = Math.max(24, Math.min(W * 0.095, P.h * 0.075));
  RIM = Math.max(3, R0 * 0.09);
  CW = Math.max(60, Math.min(P.w, P.h * 0.9));
  hoop.x = W / 2; hoop.hw = R0 * 0.98;
  hoop.y = P.y + R0 * 2.45 + 26;
  L.base = hoop.y + R0 * 3.4;
  L.startY = P.y + P.h - R0 - 46;
  L.ft = Math.max(L.base + R0 * 1.2, (L.base + L.startY) / 2);
  G = 4.6 * Math.max(120, L.startY - hoop.y);
  if (ball.state !== 'flying') placeBall(true);
}

function placeBall(keepX) {
  if (!keepX || !ball.x) ball.x = W / 2 - CW * 0.18 + Math.random() * CW * 0.36;
  ball.y = L.startY; ball.vx = ball.vy = 0;
  ball.state = 'ready'; ball.r = R0; ball.maxP = 0; ball.apex = false;
  ball.touched = false; ball.scored = false; ball.t = 0; ball.spin = 0;
  if (!keepX) ball.pop = 0;
}

/* ===== Свайп ===== */
let swipe = null;
cv.addEventListener('pointerdown', e => {
  if (!playing || ball.state !== 'ready' || e.clientY < P.y + P.h * 0.45) return;
  swipe = [{ x: e.clientX, y: e.clientY, t: performance.now() }];
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointermove', e => {
  if (!swipe) return;
  swipe.push({ x: e.clientX, y: e.clientY, t: performance.now() });
  if (swipe.length > 30) swipe.shift();
});
function endSwipe(e) {
  if (!swipe) return;
  const pts = swipe; swipe = null;
  const now = performance.now();
  const last = { x: e.clientX, y: e.clientY, t: now };
  let first = pts[0];
  for (const p of pts) { if (now - p.t <= 140) { first = p; break; } }
  const dt = Math.max(8, last.t - first.t) / 1000;
  const dx = last.x - first.x, dy = last.y - first.y;
  if (dy > -25 || pts[0].y - last.y < 30) return;
  throwBall(dx / dt, dy / dt);
}
cv.addEventListener('pointerup', endSwipe);
cv.addEventListener('pointercancel', () => { swipe = null; });

function throwBall(vxS, vyS) {
  const vRef = Math.sqrt(2 * G * (ball.y - hoop.y));
  const vy = Math.max(-vRef * 1.5, Math.min(-vRef * 0.75, vyS * 0.85));
  let vx = vy * (vxS / vyS) * 0.21;
  vx = Math.max(-W * 1.2, Math.min(W * 1.2, vx));
  Object.assign(ball, { vx, vy, state: 'flying', y0: ball.y, t: 0, spin: -5 });
  shots++;
  haptic('light');
}

/* ===== Физика ===== */
function step(dt) {
  if (ball.state !== 'flying') return;
  const n = 4, h = dt / n;
  for (let i = 0; i < n; i++) {
    const py = ball.y;
    ball.vy += G * h; ball.x += ball.vx * h; ball.y += ball.vy * h;
    if (ball.vy > 0) ball.apex = true;
    const p = Math.min(1, Math.max(0, (ball.y0 - ball.y) / (ball.y0 - hoop.y)));
    if (p > ball.maxP) ball.maxP = p;
    ball.r = R0 * (1 - 0.38 * ball.maxP);
    const deep = ball.apex && ball.maxP >= 1;
    if (!deep) continue;
    for (const s of [-1, 1]) {
      const rx = hoop.x + s * hoop.hw, ry = hoop.y;
      const dx = ball.x - rx, dy = ball.y - ry, d = Math.hypot(dx, dy), min = ball.r + RIM;
      if (d < min && d > 0) {
        const nx = dx / d, ny = dy / d;
        ball.x = rx + nx * min; ball.y = ry + ny * min;
        const vn = ball.vx * nx + ball.vy * ny;
        if (vn < 0) {
          ball.vx -= 1.55 * vn * nx; ball.vy -= 1.55 * vn * ny; ball.vx *= 0.92;
          if (!ball.touched) haptic('rigid');
          ball.touched = true;
        }
      }
    }
    if (!ball.scored && playing && py < hoop.y && ball.y >= hoop.y && Math.abs(ball.x - hoop.x) < hoop.hw - RIM) {
      ball.scored = true; score++; netKick = 1;
      $('score').textContent = score;
      updateGoal();
      const cheers = ['В яблочко!', 'Прямо в цель!'];
      const cheer = ball.touched ? cheers[Math.floor(Math.random() * cheers.length)] : 'Крууууть';
      texts.push({ t: cheer, x: hoop.x, y: hoop.y - R0 * 1.6, life: 0 });
      haptic('success');
    }
  }
  ball.t += dt;
  if (ball.y - ball.r > H || ball.x < -ball.r * 2 || ball.x > W + ball.r * 2 || ball.t > 3.5) placeBall(false);
}

/* ===== Отрисовка ===== */
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawCourt() {
  ctx.fillStyle = C.ground; ctx.fillRect(0, 0, W, H);
  ctx.save();
  rr(P.x, P.y, P.w, P.h, P.r); ctx.fillStyle = C.court; ctx.fill(); ctx.clip();
  ctx.strokeStyle = C['court-line']; ctx.lineWidth = 3;
  const bw = CW * 0.17, fw = CW * 0.24;
  ctx.beginPath(); ctx.ellipse(W / 2, L.base, CW * 0.62, Math.max(1, (P.y + P.h - L.base) * 0.75), 0, 0, Math.PI); ctx.stroke();
  ctx.fillStyle = C.paint;
  ctx.beginPath(); ctx.moveTo(W / 2 - bw, L.base); ctx.lineTo(W / 2 + bw, L.base);
  ctx.lineTo(W / 2 + fw, L.ft); ctx.lineTo(W / 2 - fw, L.ft); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(W / 2, L.ft, fw, fw * 0.3, 0, 0, Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(P.x, L.base); ctx.lineTo(P.x + P.w, L.base); ctx.stroke();
  // конфетти
  const dots = [[0.1, 0.12, 5, C.purple], [0.88, 0.2, 4, C.coral], [0.9, 0.55, 6, C.ball], [0.08, 0.6, 4, C.mint]];
  for (const [fx, fy, r, c] of dots) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(P.x + P.w * fx, P.y + P.h * fy, r, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}
function drawBoard() {
  const bw = hoop.hw * 2.7, bh = R0 * 2.9, bb = hoop.y + R0 * 0.45, bt = bb - bh;
  ctx.fillStyle = '#1D2433'; rr(hoop.x - R0 * 0.13, bb - 4, R0 * 0.26, L.base - bb + 4, 3); ctx.fill();
  rr(hoop.x - bw / 2, bt, bw, bh, R0 * 0.28);
  ctx.fillStyle = '#FFFFFF'; ctx.fill();
  ctx.lineWidth = Math.max(2.5, R0 * 0.08); ctx.strokeStyle = '#1D2433'; ctx.stroke();
  const sw = hoop.hw * 1.25, sh = R0 * 1.1;
  ctx.strokeStyle = C.coral; ctx.lineWidth = Math.max(2.5, R0 * 0.07);
  rr(hoop.x - sw / 2, hoop.y - sh, sw, sh, 4); ctx.stroke();
}
function drawRim(front) {
  ctx.strokeStyle = C.coral; ctx.lineWidth = RIM * 2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.ellipse(hoop.x, hoop.y, hoop.hw, hoop.hw * 0.26, 0, front ? 0 : Math.PI, front ? Math.PI : Math.PI * 2);
  ctx.stroke();
}
function drawNet() {
  const n = 10, ry = hoop.hw * 0.26, rb = hoop.hw * 0.6;
  const bot = hoop.y + hoop.hw * 1.15 + netKick * R0 * 0.35;
  ctx.strokeStyle = C.net; ctx.globalAlpha = 0.75; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  for (let i = 0; i <= n; i++) {
    const a = i / n * Math.PI;
    const x1 = hoop.x + Math.cos(a) * hoop.hw, y1 = hoop.y + Math.sin(a) * ry;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(hoop.x + Math.cos(a) * rb, bot + Math.sin(a) * ry * 0.6); ctx.stroke();
    if (i < n) {
      const b = (i + 1) / n * Math.PI;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(hoop.x + Math.cos(b) * rb, bot + Math.sin(b) * ry * 0.6); ctx.stroke();
    }
  }
  ctx.beginPath(); ctx.ellipse(hoop.x, bot, rb, ry * 0.6, 0, 0, Math.PI); ctx.stroke();
  ctx.globalAlpha = 1;
}
function drawBall() {
  const k = ball.state === 'ready' ? Math.min(1, ball.pop / 0.15) : 1;
  const r = ball.r * k; if (r < 1) return;
  if (ball.state === 'ready') {
    ctx.fillStyle = C['court-line'];
    ctx.beginPath(); ctx.ellipse(ball.x, ball.y + r * 0.95, r * 0.85, r * 0.2, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.save(); ctx.translate(ball.x, ball.y); ctx.rotate(ball.rot);
  ctx.fillStyle = C.ball; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#1D2433'; ctx.lineWidth = Math.max(1.4, r * 0.07);
  ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.moveTo(0, -r); ctx.lineTo(0, r); ctx.stroke();
  ctx.beginPath(); ctx.arc(-r * 1.35, 0, r * 0.95, -0.9, 0.9); ctx.stroke();
  ctx.beginPath(); ctx.arc(r * 1.35, 0, r * 0.95, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = '#1D2433'; ctx.lineWidth = Math.max(2, r * 0.08);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = Math.max(2, r * 0.1); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(ball.x, ball.y, r * 0.68, Math.PI * 1.1, Math.PI * 1.4); ctx.stroke();
}
function drawTexts(dt) {
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i]; t.life += dt;
    if (t.life > 1) { texts.splice(i, 1); continue; }
    const fs = Math.round(R0 * 0.62);
    ctx.font = `900 ${fs}px "Nunito", system-ui, sans-serif`;
    const tw = ctx.measureText(t.t).width, pw = tw + fs * 1.4, ph = fs * 1.9;
    const y = t.y - t.life * 30, x = t.x;
    ctx.globalAlpha = t.life < 0.75 ? 1 : 1 - (t.life - 0.75) / 0.25;
    ctx.save(); ctx.translate(x, y); ctx.rotate(-0.06);
    const s = Math.min(1, 0.7 + t.life * 3); ctx.scale(s, s);
    ctx.shadowColor = 'rgba(106,88,232,.28)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
    rr(-pw / 2, -ph / 2, pw, ph, ph / 2); ctx.fillStyle = C.card; ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.fillStyle = C.purple; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(t.t, 0, 1);
    ctx.restore(); ctx.globalAlpha = 1;
  }
}
function draw(dt) {
  drawCourt(); drawBoard(); drawRim(false);
  const deep = ball.state === 'flying' && ball.apex && ball.maxP >= 1;
  if (deep) { drawBall(); drawNet(); drawRim(true); }
  else { drawNet(); drawRim(true); drawBall(); }
  if (playing && shots === 0 && ball.state === 'ready') {
    ctx.font = '700 15px "Nunito", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = C.muted;
    ctx.fillText('↑ Свайпни мяч к кольцу', W / 2, Math.min(P.y + P.h - 14, ball.y + R0 + 30));
  }
  drawTexts(dt);
}

/* ===== Игровой цикл ===== */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (playing) {
    const left = Math.max(0, (endAt - now) / 1000);
    const sec = Math.ceil(left);
    $('clock').textContent = `0:${String(sec).padStart(2, '0')}`;
    $('bar').style.width = `${(left / GAME_TIME) * 100}%`;
    $('clockTile').classList.toggle('hot', left <= 10 && left > 0);
    if (left <= 0) endGame();
  }
  if (ball.state === 'ready') ball.pop += dt;
  ball.rot += (ball.spin + ball.vx / Math.max(ball.r, 1) * 0.3) * dt;
  step(dt);
  netKick *= Math.pow(0.02, dt);
  try { draw(dt); } catch (e) { console.warn(e); }
  requestAnimationFrame(frame);
}

/* ===== Иллюстрации ===== */
const ICON = {
  send: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>',

  trend: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17l6-6 4 4 7-7"/><path d="M14 8h7v7"/></svg>',
  equal: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14M5 15h14"/></svg>',
  clock: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M10 2h4"/></svg>',
  star: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>'
};
const ART_START = `<svg class="art" viewBox="0 0 320 340" fill="none" aria-hidden="true">
  <circle cx="40" cy="60" r="6" fill="#3CCFB4"/><circle cx="286" cy="42" r="5" fill="#D2432F"/>
  <circle cx="276" cy="240" r="7" fill="#6A58E8"/><circle cx="30" cy="226" r="4" fill="#F28A2E"/>

const ART_DONE = `<svg class="art" style="max-width:220px" viewBox="0 0 240 190" fill="none" aria-hidden="true">
  <path d="M70 100 C 60 40 150 10 180 60 C 210 110 170 170 110 160 C 70 154 76 128 70 100 Z" fill="#3CCFB4"/>

</svg>`;

/* ===== Экраны ===== */
function plural(n, f) {
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return f[0];
  if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return f[1];
  return f[2];
}
const balls = n => plural(n, ['мяч', 'мяча', 'мячей']);
function show(html) { $('card').innerHTML = html; $('overlay').hidden = false; $('overlay').scrollTop = 0; }

function updateGoal() {
  const g = $('goal');
  if (rivalScore === null) { g.hidden = true; return; }
  g.hidden = false;
  $('goalText').textContent = `Цель друга: ${rivalScore}`;
  const need = rivalScore + 1 - score;
  $('goalLeft').textContent = need > 0 ? `ещё ${need}` : 'обгоняешь!';
}

function showStart() {
  if (rivalScore !== null) {
    show(`
      <div class="avatars">
        <div class="av friend">Д</div><div class="vs">vs</div><div class="av me">Я</div>
      </div>
      <h1>Тебя вызвали на дуэль!</h1>
      <p class="sub">Друг забил ${rivalScore} ${balls(rivalScore)} за 45 секунд. Сможешь больше?</p>
      <div class="target"><div><small>Твоя цель</small><b>${rivalScore + 1}+</b></div>
        <svg width="60" height="60" viewBox="0 0 64 64" fill="none" aria-hidden="true"><circle cx="32" cy="32" r="28" fill="#F28A2E" stroke="#1D2433" stroke-width="3"/><path d="M4 32h56M32 4v56" stroke="#1D2433" stroke-width="2.5"/><path d="M14 12 Q 28 32 14 52M50 12 Q 36 32 50 52" stroke="#1D2433" stroke-width="2.5"/></svg>
      </div>
      <div class="rules">
        <div class="row"><span class="ico mint">${ICON.clock}</span>45 секунд на раунд</div>
        <div class="row"><span class="ico purple">${ICON.up}</span>Свайпай мяч к кольцу</div>
        <div class="row"><span class="ico coral">${ICON.star}</span>Можно переиграть — в зачёт лучшая попытка</div>
      </div>
      <div class="grow"></div>
      <button class="btn primary" id="go">Принять вызов</button>`);
  } else {
    show(`
      ${ART_START}
      <h1>Броски за 45 секунд</h1>
      <p class="sub">Свайпай мяч в кольцо, набирай очки и вызывай друзей на дуэль</p>
      <div class="grow"></div>
      <button class="btn primary" id="go">Начать игру</button>
      ${inTg ? '' : '<button class="link" id="demo">Посмотреть режим дуэли (демо)</button>'}`);
    if (!inTg) $('demo').onclick = () => { rivalScore = 12; challengerId = ''; tries = 0; bestTry = 0; showStart(); };
  }
  $('go').onclick = startGame;
}

function startGame() {
  score = 0; shots = 0; texts.length = 0;
  $('score').textContent = '0';
  updateGoal();
  $('overlay').hidden = true;
  resize();
  placeBall(false);
  endAt = performance.now() + GAME_TIME * 1000;
  playing = true;
}

function endGame() {
  playing = false; swipe = null;
  $('clockTile').classList.remove('hot'); $('clock').textContent = '0:00'; $('bar').style.width = '0%';
  const best = Math.max(getBest(), score); setBest(best);
  haptic('heavy');
  if (rivalScore !== null) return endDuelRound();
  tries++; bestTry = Math.max(bestTry, score);
  const acc = shots ? Math.round(score / shots * 100) : 0;
  show(`
    ${ART_DONE}
    <p class="kicker">Время вышло!</p>
    <div class="big">${score}</div>
    <p class="unit">${balls(score)} в кольце</p>
    <div class="stats">
      <div class="stat purple"><small>Лучшая попытка</small><b>${bestTry}</b></div>
      <div class="stat coral"><small>Точность</small><b>${acc}%</b></div>
    </div>
    <div class="grow"></div>
    <button class="btn primary" id="again">Ещё раз</button>
    <button class="btn secondary" id="finish">Завершить</button>
    <p class="note">Другу отправится лучшая попытка</p>`);
  $('again').onclick = startGame;
  $('finish').onclick = finishSolo;
}

// Первый игрок завершил: показываем результат и сразу предлагаем отправить вызов
function finishSolo() {
  const best = getBest();
  show(`
    ${ART_DONE}
    <p class="kicker">Твой результат</p>
    <div class="big">${bestTry}</div>
    <p class="unit">${balls(bestTry)} в кольце</p>
    <div class="stats">
      <div class="stat purple"><small>Рекорд</small><b>${best}</b></div>
      <div class="stat coral"><small>Попыток</small><b>${tries}</b></div>
    </div>
    <div class="row"><span class="ico mint">${ICON.send}</span>Отправь вызов другу — пусть попробует побить</div>
    <div class="grow"></div>
    <button class="btn primary" id="share">${ICON.send}Вызвать друга</button>
    <button class="btn secondary" id="newgame">Новая игра</button>
    <p class="note" id="note"></p>`);
  const result = bestTry;
  $('share').onclick = () => challenge(result);
  $('newgame').onclick = newGame;
  haptic('success');
  challenge(result);
}

// Соперник в дуэли: может переигрывать, в зачёт идёт лучшая попытка
function endDuelRound() {
  tries++; bestTry = Math.max(bestTry, score);
  const d = bestTry - rivalScore;
  const status = d > 0 ? [ICON.trend, 'mint', `Ты впереди на ${d}`]
    : d === 0 ? [ICON.equal, 'purple', `Пока ничья: ${bestTry} : ${rivalScore}`]
    : [ICON.down, 'coral', `Друг впереди на ${-d}`];
  show(`
    ${ART_DONE}
    <p class="kicker">Время вышло!</p>
    <div class="big">${score}</div>
    <p class="unit">${balls(score)} в кольце</p>
    <div class="stats">
      <div class="stat purple"><small>Лучшая попытка</small><b>${bestTry}</b></div>
      <div class="stat coral"><small>Цель друга</small><b>${rivalScore}</b></div>
    </div>
    <div class="row"><span class="ico ${status[1]}">${status[0]}</span>${status[2]}</div>
    <div class="grow"></div>
    <button class="btn primary" id="again">Ещё раз</button>
    <button class="btn secondary" id="finish">Завершить</button>
    <p class="note">В зачёт идёт лучшая попытка</p>`);
  $('again').onclick = startGame;
  $('finish').onclick = finishDuel;
}

function finishDuel() {
  finalDuel = { a: rivalScore, b: bestTry, aId: challengerId };
  showFinal('b');
  sendResult();
}

// role: 'a' — тот, кто вызвал; 'b' — соперник; '' — неизвестно
function showFinal(role) {
  const { a, b } = finalDuel;
  let lName, rName, l, r, title, lAv, rAv;
  if (role) {
    l = role === 'a' ? a : b; r = role === 'a' ? b : a;
    lName = 'Ты'; rName = 'Друг'; lAv = 'Я'; rAv = 'Д';
    title = l > r ? 'Победа за тобой!' : l === r ? 'Ничья!' : 'Победа за другом';
  } else {
    l = a; r = b; lName = 'Первый'; rName = 'Второй'; lAv = '1'; rAv = '2';
    title = a > b ? 'Победил первый игрок' : a === b ? 'Ничья!' : 'Победил второй игрок';
  }
  show(`
    <p class="kicker">Итог дуэли</p>
    <h1 style="margin-top:6px">${title}</h1>
    <div class="avatars" style="margin-top:26px">
      <div class="player"><div class="av me">${lAv}</div><span class="name">${lName}</span><span class="pts ${l > r ? 'win' : ''}">${l}</span></div>
      <div class="vs">vs</div>
      <div class="player"><div class="av friend">${rAv}</div><span class="name">${rName}</span><span class="pts ${r > l ? 'win' : ''}">${r}</span></div>
    </div>
    ${role === 'b' ? `<div class="row" style="margin-top:28px"><span class="ico mint">${ICON.send}</span>Отправь итог другу, чтобы он тоже его увидел</div>` : ''}
    <div class="grow"></div>
    ${role === 'b' ? `<button class="btn primary" id="send">${ICON.send}Отправить итог другу</button>` : ''}
    <button class="btn ${role === 'b' ? 'secondary' : 'primary'}" id="newgame">Новая игра</button>
    <p class="note" id="note"></p>`);
  if (role === 'b') $('send').onclick = sendResult;
  $('newgame').onclick = newGame;
  haptic('success');
}

function sendResult() {
  const { a, b, aId } = finalDuel;
  const link = `${APP_LINK}?startapp=r${a}_${b}${aId ? '_' + aId : ''}`;
  const verdict = b > a ? 'Победа за мной!' : b === a ? 'Ничья!' : 'Победа за тобой!';
  shareLink(link, `Итог дуэли 🏀 Ты: ${a}, я: ${b}. ${verdict}`);
}

function newGame() {
  rivalScore = null; finalDuel = null; tries = 0; bestTry = 0;
  updateGoal();
  startGame();
}

function challenge(s) {
  const link = `${APP_LINK}?startapp=c${s}${myId ? '_' + myId : ''}`;
  shareLink(link, `Я забил ${s} за 45 секунд 🏀 Побьёшь?`);
}

function shareLink(link, text) {
  if (inTg) {
    tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(text)}`);
  } else if (navigator.share) {
    navigator.share({ text, url: link }).catch(() => {});
  } else {
    const n = $('note'); if (n) n.textContent = 'Отправить ссылку можно, когда игра открыта в Telegram.';
  }
}

/* ===== Старт ===== */
window.addEventListener('resize', resize);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors); } catch (e) {}
if (tg && tg.onEvent) { try { tg.onEvent('themeChanged', () => { if (inTg) document.documentElement.dataset.theme = tg.colorScheme; readColors(); }); } catch (e) {} }
resize();
if (finalDuel) {
  const role = myId && finalDuel.aId ? (myId === finalDuel.aId ? 'a' : 'b') : '';
  showFinal(role);
} else {
  updateGoal();
  showStart();
}
requestAnimationFrame(frame);
</script>
